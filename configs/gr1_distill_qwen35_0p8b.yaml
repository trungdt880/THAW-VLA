# Cosmos3-Nano C1 REPA distill, RoboCasa-GR1, Qwen3.5-0.8B — 100k full-length run (vs EXP-13 40k).
# Paired with the no-REPA baseline (starvla_baseline_gr1_qwen35_0p8b_100k.yaml) for a clean C1 ablation.
run_id: starvla_distill_cosmos3nano_gr1_qwen35_0p8b_100k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ""
wandb_project: thinklikewam
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 29           # GR1 arms+waist+hands
    state_dim: 58
    action_horizon: 16
  # --- Channel 1: Cosmos3-Nano REPA distillation (training-only; dropped at inference) ---
  distill:
    use_repa: true
    repa_mode: pooled
    lambda_repa: 0.5
    teacher_dim: 4096        # Cosmos3-Nano Reasoner hidden; MUST match cache
    n_cam: 1                 # GR1 single ego camera -> target_dim = 1*4096 = 4096
    use_future: false
    lambda_future: 0.5
    n_future: 8
    future_grid_h: 16
    future_grid_w: 16
    latent_channels: 48
    future_patch: 2
    future_layers: 6

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000
    action_type: delta_ee
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    # --- Cosmos3-Nano REPA cache (offline precompute; MUST match tools/cosmos3_precompute_targets.py --n_cam 1) ---
    fastwam_target_cache: playground/caches/gr1_cosmos3nano
    fastwam_variant: cosmos3nano
    fastwam_tap_layer: 24
    fastwam_mode: pooled

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: null
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
