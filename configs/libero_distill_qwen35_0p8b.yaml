# Cosmos3-Nano(understanding VLM) -> QwenGR00T distillation, Channel 1 (REPA), LIBERO — Qwen3.5-0.8B.
# EXP-7 (D-REPA substrate): third teacher family. Teacher = the UNDERSTANDING half of
# nvidia/Cosmos3-Nano (Qwen3-VL-8B Reasoner), tapped at decoder layer-24 image-token hidden
# (64 tokens @256px -> mean-pooled per cam -> [4096], concat 2 cams -> target_dim 4096*2=8192).
#
# Targets are PRECOMPUTED offline (16B teacher; tools/cosmos3_precompute_targets.py) into a
# fastwam_cache-compatible memmap, so this consumes the EXISTING offline `fastwam_target_cache`
# path with NO model-side change (RepaProjector auto-sizes student_dim -> teacher_dim=4096).
#
# Scientific question: does Cosmos3-Nano (Qwen3-VL family, SAME as the student) match/beat the
# FastWAM (0.973) and V-JEPA2-AC (0.969) plateaus? And — for D-REPA — does the rep-geometry /
# OOD (LIBERO-Plus) payoff appear where in-distribution SR saturates?
run_id: libero_distill_cosmos3nano_qwen35_0p8b
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ""
wandb_project: thinklikewam
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 8
  # --- Channel 1: Cosmos3-Nano REPA distillation (training-only; dropped at inference) ---
  distill:
    use_repa: true
    repa_mode: pooled        # pooled (drop-in baseline). spatial variant uses a separate cache.
    lambda_repa: 0.5
    teacher_dim: 4096        # Cosmos3-Nano Reasoner hidden (text_config.hidden_size); MUST match cache
    n_cam: 2
    # --- Channel 2: future-latent flow head (OFF; REPA-only teacher-swap first) ---
    use_future: false
    lambda_future: 0.5
    n_future: 8
    future_grid_h: 16        # Wan2.2 VAE latent grid (256px -> 16x16); for future C2 later
    future_grid_w: 16
    latent_channels: 48      # Wan z_dim
    future_patch: 2
    future_layers: 6

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    # --- Cosmos3-Nano REPA cache (offline precompute; MUST match tools/cosmos3_precompute_targets.py) ---
    fastwam_target_cache: playground/caches/libero_cosmos3nano
    fastwam_variant: cosmos3nano
    fastwam_tap_layer: 24
    fastwam_mode: pooled

trainer:
  max_train_steps: 80000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: null        # CRITICAL: VLM must be trainable for REPA to do anything
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
