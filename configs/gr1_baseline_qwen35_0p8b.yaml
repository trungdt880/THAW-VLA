# NO-REPA BASELINE, RoboCasa-GR1, Qwen3.5-0.8B — 100k. Identical to the Cosmos-C1 100k config EXCEPT
# use_repa:false + no fastwam_target_cache (so the REPA channel is fully off). Isolates exactly what C1
# REPA contributes: this run vs starvla_distill_cosmos3_gr1_qwen35_0p8b_100k.yaml is the clean ablation.
run_id: starvla_baseline_gr1_qwen35_0p8b_100k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ""
wandb_project: thinklikewam
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 29           # GR1 arms+waist+hands
    state_dim: 58
    action_horizon: 16
  # --- REPA OFF: no distillation channel (clean baseline) ---
  distill:
    use_repa: false
    use_future: false

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000
    action_type: delta_ee
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 64
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    # NO fastwam_target_cache -> REPA cache never loaded (cache-enabled keys off path presence).

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: null
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
